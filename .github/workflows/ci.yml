name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install preprocessing dependencies
        run: python -m pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple "numpy<3" "opencv-python-headless>=4.8,<5" "PyYAML>=6,<7"
      - name: Run dataset and video tests
        env:
          PYTHONPATH: src
        run: |
          mkdir -p .trash
          python -m unittest discover -s tests -v
          python -m yolo_enemy_detection --help
